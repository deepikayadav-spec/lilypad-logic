<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>lilypad</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0d1512; --surface:#141f1a; --line:#24352c;
  --text:#eafff2; --dim:#7d9b8a;
  --water:#12564f; --water-2:#0a2f34; --deep:#061d22;
  --pad:#1f5c3f;
  --lime:#b6ff3d; --lime-ink:#0d1512;
  --green:#4ade6a; --yellow:#ffd23d; --red:#ff5c5c;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Space Grotesk",system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:14px 14px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:14px;
}

/* ---- top bar: name left, level centre ---- */
.bar{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;
  max-width:1180px; width:100%; margin:0 auto; flex:0 0 auto;
}
.brand{
  display:flex; align-items:center; gap:7px;
  font-weight:700; font-size:17px; letter-spacing:-.02em;
}
.brand span{font-size:19px;line-height:1}
.level{
  display:flex; align-items:center; gap:4px;
  font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:700;
  letter-spacing:.02em; color:var(--dim);
}
.level b{color:var(--text);font-variant-numeric:tabular-nums}
.level button{
  font:inherit; font-size:15px; line-height:1; cursor:pointer;
  background:none; border:0; color:var(--dim); padding:4px 7px; border-radius:8px;
}
.level button:hover:not(:disabled){background:var(--surface);color:var(--text)}
.level button:disabled{opacity:.25;cursor:not-allowed}

/* ---- stage: the pond owns the screen ---- */
main{
  flex:1 1 auto; display:grid; gap:14px; align-content:start;
  grid-template-columns:minmax(0,1fr);
  max-width:1180px; width:100%; margin:0 auto;
}
@media (min-width:900px){
  main{grid-template-columns:minmax(0,1fr) minmax(320px,430px);align-items:center;gap:30px}
}

.pondwrap{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
/* square, and never taller than the screen — no scrolling to see the pond */
#stage{
  position:relative; width:min(100%,calc(100dvh - 118px)); aspect-ratio:1/1;
  border-radius:18px; overflow:hidden;
  background:
    radial-gradient(130% 95% at 28% 8%, color-mix(in srgb,var(--water) 78%,#fff 22%), transparent 58%),
    linear-gradient(165deg,var(--water),var(--water-2) 66%,var(--deep));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), 0 24px 50px -30px rgba(0,0,0,.9);
}
#stage::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 7.5%,rgba(255,255,255,.04) 7.5% 7.8%);
}
#pond,#pads{position:absolute;inset:0;display:flex}
#pads{z-index:1} #pond{z-index:2}
/* percentage sizing keeps ~6 per row at every pond size, so wrap puzzles hold */
.frog,.pad{width:15.47%;height:15.47%;flex:0 0 auto;display:block}
.frog svg,.pad svg{display:block;width:100%;height:100%}
.frog svg{transform:scale(.72);transform-origin:50% 50%}
.pad{transition:filter .25s,opacity .25s}
.pad.lit{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--lime) 70%,transparent))}
.pad:not(.lit){opacity:.82}
.frog{transition:filter .2s}
.frog:not(.home){filter:saturate(.55) brightness(.88)}
.frog.hop{animation:hop .34s cubic-bezier(.3,1.7,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-13%) scale(1.08,.92)}100%{transform:translateY(0) scale(1)}}
.frog.win{animation:win .45s ease-in-out 2}
@keyframes win{0%,100%{transform:translateY(0)}50%{transform:translateY(-9%)}}
@media (prefers-reduced-motion:reduce){.frog.hop,.frog.win{animation:none}}

.score{
  font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:500;
  color:var(--dim); text-align:center; min-height:20px; margin:0;
}
.score b{color:var(--text)}
.score.done{color:var(--lime);font-weight:700}

/* ---- goal + code ---- */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.goal{
  margin:0; font-size:16px; line-height:1.45; font-weight:500; text-wrap:balance;
}
.goal code{
  font-family:"JetBrains Mono",monospace; font-size:.85em; font-weight:500;
  background:var(--surface); border:1px solid var(--line);
  padding:1px 6px; border-radius:6px; white-space:nowrap;
}

.code{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.code-top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 12px;border-bottom:1px solid var(--line);
  font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);
}
.code-top button{
  font:inherit;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:0;color:var(--dim);cursor:pointer;padding:2px 4px;border-radius:6px;
}
.code-top button:hover{color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;margin-right:6px;vertical-align:1px}
.code-top.solved{color:var(--lime)} .code-top.solved .dot{background:var(--lime)}
.rule{
  padding:11px 14px;font-family:"JetBrains Mono",monospace;font-size:13.5px;
  border-left:2px solid transparent;cursor:text;
}
.rule + .rule{border-top:1px dashed var(--line)}
/* only worth pointing out when there's more than one rule to write into */
.multi .rule.active{border-left-color:var(--lime)}
.sel{color:var(--dim)} .sel b{color:var(--text);font-weight:700}
textarea{
  display:block;width:100%;resize:none;border:0;outline:0;background:none;
  color:var(--lime);font:inherit;line-height:1.75;padding:2px 0 2px 20px;
  min-height:1.75em;overflow:hidden;caret-color:var(--lime);
}
textarea::placeholder{color:var(--dim);opacity:.5}

/* ---- the kit: which props are in play, and their legal values ---- */
.kit{border-top:1px solid var(--line);padding:9px 14px;display:flex;flex-direction:column;gap:8px}
.kit-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kit-label{
  font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-right:2px;
}
.kit-label .target{color:var(--lime);font-weight:700}
.chip{
  font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1;
  padding:6px 9px;border-radius:999px;cursor:pointer;
  background:none;border:1px solid var(--line);color:var(--text);
  transition:border-color .15s,color .15s,background .15s;
}
.chip:hover{border-color:var(--lime);color:var(--lime)}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);font-weight:700}
.chip.val{color:var(--dim)}
.chip.val:hover{color:var(--lime)}

.hints{
  margin:0;padding:0;list-style:none;border-top:1px solid var(--line);
  display:flex;flex-direction:column;
}
/* block, not flex — a flex li would split the message into separate items */
.hints li{
  position:relative;font-size:13px;line-height:1.5;color:var(--text);
  padding:9px 14px 9px 33px;
}
.hints li + li{border-top:1px dashed var(--line)}
.hints li::before{
  content:"→";position:absolute;left:14px;top:9px;
  color:var(--lime);font-weight:700;
  font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.6;
}
.hints code{
  font-family:"JetBrains Mono",monospace;font-size:11.5px;
  background:var(--bg);border:1px solid var(--line);padding:0 5px;border-radius:5px;
}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><span>🐸</span>lilypad</div>
  <div class="level">
    <button id="prev" type="button" aria-label="Previous level">‹</button>
    <b id="lvl">01</b>/24
    <button id="next" type="button" aria-label="Next level">›</button>
  </div>
  <div></div>
</header>

<main>
  <div class="pondwrap">
    <div id="stage">
      <div id="pads"></div>
      <div id="pond"></div>
    </div>
    <p class="score" id="score"></p>
  </div>

  <div class="side">
    <p class="goal" id="goal"></p>
    <div class="code">
      <div class="code-top" id="top">
        <span><span class="dot"></span><span id="state">not yet</span></span>
        <button id="clear" type="button">clear</button>
      </div>
      <div id="rules"></div>
      <div class="kit" id="kit"></div>
      <ul class="hints" id="hints" hidden></ul>
    </div>
  </div>
</main>

<script>
(function(){
  "use strict";

  var G="green", Y="yellow", R="red";
  var THREE=[G,Y,R], EIGHT=[G,Y,R,G,Y,R,G,Y], TWELVE=[G,Y,R,G,Y,R,G,Y,R,G,Y,R];

  var LEVELS=[
    {frogs:[G], goal:"frog's stuck on the left. its pad is way over on the right. send it.",
     eds:[{sel:"#pond"}], sol:"#pads{justify-content:flex-end}"},
    {frogs:[G], goal:"now park it dead centre.",
     eds:[{sel:"#pond"}], sol:"#pads{justify-content:center}"},
    {frogs:THREE, goal:"3 frogs, 3 pads. outer two hug the edges, gaps split evenly.",
     eds:[{sel:"#pond"}], sol:"#pads{justify-content:space-between}"},
    {frogs:THREE, goal:"same 3, but now every pad gets equal space wrapped around it.",
     eds:[{sel:"#pond"}], sol:"#pads{justify-content:space-around}"},
    {frogs:[G], goal:"pad sank to the bottom. <code>align-items</code> runs down the cross axis.",
     eds:[{sel:"#pond"}], sol:"#pads{align-items:flex-end}"},
    {frogs:[G], goal:"straight up middle of the pond. you need both axes for this one.",
     eds:[{sel:"#pond"}], sol:"#pads{justify-content:center;align-items:center}"},
    {frogs:THREE, goal:"3 pads on the floor, evenly surrounded. stack the two props.",
     eds:[{sel:"#pond"}], sol:"#pads{justify-content:space-around;align-items:flex-end}"},
    {frogs:THREE, goal:"pads now read green → yellow → red starting from the right. flip the main axis.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-direction:row-reverse}"},
    {frogs:THREE, goal:"pads stacked down the left edge. stand the axis up.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-direction:column}"},
    {frogs:THREE, goal:"flipped order, packed to the left. peep how <code>flex-end</code> follows the flip.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-direction:row-reverse;justify-content:flex-end}"},
    {frogs:THREE, goal:"a column chilling on the floor.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-direction:column;justify-content:flex-end}"},
    {frogs:THREE, goal:"column read bottom → top, stretched floor to surface.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-direction:column-reverse;justify-content:space-between}"},
    {frogs:THREE, goal:"flipped row, centred, sitting on the floor. 3 declarations.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-direction:row-reverse;justify-content:center;align-items:flex-end}"},
    {frogs:THREE, goal:"don't touch the pond. yellow just goes last. give it <code>order</code>.",
     eds:[{sel:".yellow"}], sol:"#pads .p-yellow{order:1}"},
    {frogs:THREE, goal:"red, then green, then yellow. everyone starts at 0 and negatives are legal.",
     eds:[{sel:".red"},{sel:".yellow"}], sol:"#pads .p-red{order:-1}#pads .p-yellow{order:1}"},
    {frogs:THREE, goal:"yellow broke rank and sank. <code>align-self</code> overrides the pond for one item.",
     eds:[{sel:".yellow"}], sol:"#pads .p-yellow{align-self:flex-end}"},
    {frogs:THREE, goal:"centred and on the floor — except yellow, still up top.",
     eds:[{sel:"#pond"},{sel:".yellow"}], sol:"#pads{justify-content:center;align-items:flex-end}#pads .p-yellow{align-self:flex-start}"},
    {frogs:EIGHT, goal:"8 frogs, row's too tight. let the line break.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-wrap:wrap}"},
    {frogs:EIGHT, goal:"fill downwards first, then start a fresh column.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-direction:column;flex-wrap:wrap}"},
    {frogs:EIGHT, goal:"same wrap, rows read right → left. <code>flex-flow</code> = direction + wrap in one.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-flow:row-reverse wrap}"},
    {frogs:TWELVE, goal:"12 frogs wrap into 2 rows, both shoved to the top. <code>align-content</code> spaces the lines.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-wrap:wrap;align-content:flex-start}"},
    {frogs:TWELVE, goal:"both rows on the floor now.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-wrap:wrap;align-content:flex-end}"},
    {frogs:TWELVE, goal:"2 rows floating together in the middle.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-wrap:wrap;align-content:center}"},
    {frogs:TWELVE, goal:"last one. columns bottom → top, wrapping backwards, centred, the 2 columns pushed to opposite edges.",
     eds:[{sel:"#pond"}], sol:"#pads{flex-flow:column-reverse wrap-reverse;justify-content:center;align-content:space-between}"}
  ];

  var VALS={
    "flex-direction":["row","row-reverse","column","column-reverse"],
    "justify-content":["flex-start","flex-end","center","space-between","space-around","space-evenly"],
    "align-items":["flex-start","flex-end","center","baseline","stretch"],
    "align-self":["flex-start","flex-end","center","baseline","stretch"],
    "order":["-1","0","1","2"],
    "flex-wrap":["nowrap","wrap","wrap-reverse"],
    "flex-flow":["row wrap","column wrap","row-reverse wrap","column-reverse wrap-reverse"],
    "align-content":["flex-start","flex-end","center","space-between","space-around","stretch"]
  };
  var OK={"display":1,"flex-direction":1,"flex-wrap":1,"flex-flow":1,"justify-content":1,
    "align-items":1,"align-content":1,"align-self":1,"order":1,"flex":1,"flex-grow":1,
    "flex-shrink":1,"flex-basis":1,"gap":1,"row-gap":1,"column-gap":1};
  var PROPS=[]; for(var k in OK) PROPS.push(k);

  var HEX={green:"#4ade6a",yellow:"#ffd23d",red:"#ff5c5c"};

  function frogSvg(c){
    var f=HEX[c];
    return '<svg viewBox="0 0 64 64" aria-hidden="true">'+
      '<ellipse cx="32" cy="41" rx="21" ry="17" fill="'+f+'" stroke="rgba(6,18,14,.55)" stroke-width="1.6"/>'+
      '<ellipse cx="32" cy="46" rx="14" ry="9" fill="rgba(255,255,255,.22)"/>'+
      '<circle cx="19" cy="22" r="11" fill="'+f+'" stroke="rgba(6,18,14,.55)" stroke-width="1.6"/>'+
      '<circle cx="45" cy="22" r="11" fill="'+f+'" stroke="rgba(6,18,14,.55)" stroke-width="1.6"/>'+
      '<circle cx="19" cy="22" r="7" fill="#fff"/><circle cx="45" cy="22" r="7" fill="#fff"/>'+
      '<circle cx="21" cy="23" r="3.6" fill="#0d1512"/><circle cx="43" cy="23" r="3.6" fill="#0d1512"/>'+
      '<path d="M22 44 q10 8 20 0" stroke="rgba(10,25,19,.6)" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+
      '</svg>';
  }
  function padSvg(c){
    var f=HEX[c];
    return '<svg viewBox="0 0 64 64" aria-hidden="true">'+
      '<circle cx="32" cy="32" r="30" fill="var(--pad)"/>'+
      '<path d="M32 32 L61.5 23 A30 30 0 0 1 61.5 41 Z" fill="var(--water-2)"/>'+
      '<circle cx="32" cy="32" r="28" fill="none" stroke="'+f+'" stroke-width="4.5"/>'+
      '<circle cx="32" cy="32" r="22.5" fill="none" stroke="'+f+'" stroke-width="1.5" opacity=".45"/>'+
      '<circle cx="32" cy="32" r="6" fill="'+f+'" opacity=".85"/>'+
      '</svg>';
  }

  var pond=document.getElementById("pond"), pads=document.getElementById("pads"),
      rulesEl=document.getElementById("rules"), hintsEl=document.getElementById("hints"),
      goalEl=document.getElementById("goal"), lvlEl=document.getElementById("lvl"),
      kitEl=document.getElementById("kit"),
      scoreEl=document.getElementById("score"), topEl=document.getElementById("top"),
      stateEl=document.getElementById("state"),
      nextBtn=document.getElementById("next"), prevBtn=document.getElementById("prev");

  var userStyle=document.createElement("style"); document.head.appendChild(userStyle);
  var solStyle=document.createElement("style"); document.head.appendChild(solStyle);

  var state={level:0,solved:{},text:{}}, advance=null, hintTimer=null, activeIdx=0;

  function load(){
    try{
      var s=JSON.parse(localStorage.getItem("lilypad")||"null");
      if(s&&typeof s==="object"){
        state.solved=s.solved||{}; state.text=s.text||{};
        if(typeof s.level==="number") state.level=Math.min(Math.max(s.level,0),LEVELS.length-1);
      }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem("lilypad",JSON.stringify(state)); }catch(e){} }

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function dist(a,b){
    var m=a.length,n=b.length,prev=[],cur=[],i,j;
    for(j=0;j<=n;j++) prev[j]=j;
    for(i=1;i<=m;i++){
      cur[0]=i;
      for(j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
      prev=cur.slice();
    }
    return prev[n];
  }
  function nearProp(p){
    var best=null,bd=99;
    for(var i=0;i<PROPS.length;i++){ var d=dist(p,PROPS[i]); if(d<bd){bd=d;best=PROPS[i];} }
    return bd<=3?best:null;
  }
  function nearVal(prop,v){
    var list=VALS[prop]; if(!list) return null;
    var best=null,bd=99;
    for(var i=0;i<list.length;i++){ var d=dist(v,list[i]); if(d<bd){bd=d;best=list[i];} }
    return bd<=3?best:null;
  }
  function supports(p,v){
    try{ return window.CSS&&CSS.supports?(v===undefined?CSS.supports(p+": inherit"):CSS.supports(p,v)):true; }
    catch(e){ return true; }
  }

  // one textarea -> safe css + plain-english gripes
  function parse(raw){
    var parts=String(raw||"").split(";"), out=[], hints=[], i;
    for(i=0;i<parts.length;i++){
      var t=parts[i].trim();
      if(!t) continue;
      if(/[{}@<>]|url\(/.test(t)){ hints.push("just <code>property: value;</code> inside the braces."); continue; }
      var c=t.indexOf(":");
      if(c<0){
        var g=nearProp(t.toLowerCase());
        hints.push("no colon. it goes <code>"+(g||"property")+": value;</code>");
        continue;
      }
      var prop=t.slice(0,c).trim().toLowerCase(), val=t.slice(c+1).trim();
      if(!prop){ hints.push("value with no property in front of it."); continue; }
      if(!val){ hints.push("<code>"+esc(prop)+"</code> has no value yet."); continue; }
      if(val.indexOf(":")>-1){ hints.push("missing a <code>;</code> — every line ends with one."); continue; }
      if(!OK[prop]){
        var gp=nearProp(prop);
        if(gp) hints.push("<code>"+esc(prop)+"</code> isn't a thing. you mean <code>"+gp+"</code>?");
        else if(supports(prop)) hints.push("<code>"+esc(prop)+"</code> is real css but this pond only does flexbox.");
        else hints.push("<code>"+esc(prop)+"</code> isn't a css property.");
        continue;
      }
      if(!supports(prop,val)){
        var gv=nearVal(prop,val), msg="<code>"+esc(prop)+"</code> doesn't take <code>"+esc(val)+"</code>.";
        if(gv) msg+=" you mean <code>"+gv+"</code>?";
        else if(VALS[prop]) msg+=" options: <code>"+VALS[prop].join("</code> <code>")+"</code>";
        hints.push(msg);
        continue;
      }
      out.push(prop+":"+val);
    }
    return {css:out.join(";"), hints:hints, n:out.length};
  }

  function applyUser(){
    var lvl=LEVELS[state.level], css="", hints=[], n=0;
    var areas=rulesEl.querySelectorAll("textarea");
    for(var i=0;i<areas.length;i++){
      var r=parse(areas[i].value);
      n+=r.n;
      if(r.css) css+="#stage "+lvl.eds[i].sel+"{"+r.css+"}";
      for(var j=0;j<r.hints.length;j++)
        hints.push(areas.length>1?("<code>"+lvl.eds[i].sel+"</code> — "+r.hints[j]):r.hints[j]);
    }
    userStyle.textContent=css;
    return {hints:hints,n:n};
  }

  function paintHints(list){
    hintsEl.textContent="";
    if(!list.length){ hintsEl.hidden=true; return; }
    hintsEl.hidden=false;
    for(var i=0;i<list.length;i++){
      var li=document.createElement("li");
      li.innerHTML=list[i];
      hintsEl.appendChild(li);
    }
  }
  // half-typed words aren't mistakes — hold hints till typing pauses
  function showHints(list,defer){
    clearTimeout(hintTimer);
    if(!defer||!list.length){ paintHints(list); return; }
    hintsEl.hidden=true;
    hintTimer=setTimeout(function(){ paintHints(list); },700);
  }

  var slowMo=window.matchMedia?window.matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};
  function hop(){
    if(slowMo.matches) return;
    var f=pond.children;
    for(var i=0;i<f.length;i++)(function(el,n){
      el.classList.remove("hop"); void el.offsetWidth;
      setTimeout(function(){ el.classList.add("hop"); }, n*22);
    })(f[i],i);
  }

  // which frog reached which pad; -1 = still swimming
  function landed(){
    var frogs=pond.children, p=pads.children, map=[], used=[], home=0, i, j;
    for(i=0;i<frogs.length;i++){
      var f=frogs[i], hit=-1;
      for(j=0;j<p.length;j++){
        if(used[j]||p[j].getAttribute("data-c")!==f.getAttribute("data-c")) continue;
        if(Math.abs(p[j].offsetLeft-f.offsetLeft)<=8 && Math.abs(p[j].offsetTop-f.offsetTop)<=8){ hit=j; break; }
      }
      if(hit>-1){ used[hit]=true; home++; }
      map.push(hit);
    }
    return {map:map,used:used,home:home,total:frogs.length};
  }

  function pad2(n){ return (n<10?"0":"")+n; }

  function check(typing){
    var rep=applyUser();
    if(typing) hop();

    var res=landed(), win=res.total>0&&res.home===res.total, i;
    var P=pads.children, F=pond.children;
    for(i=0;i<P.length;i++) P[i].classList.toggle("lit",!!res.used[i]);
    for(i=0;i<F.length;i++) F[i].classList.toggle("home",res.map[i]>-1);

    topEl.classList.toggle("solved",win);
    stateEl.textContent=win?"solved":(rep.n?rep.n+" rule"+(rep.n===1?"":"s")+" live":"not yet");

    showHints(win?[]:rep.hints,typing);
    clearTimeout(advance);

    if(win){
      scoreEl.className="score done";
      scoreEl.textContent=state.level===LEVELS.length-1?"that's all 24. you cooked. 🔥":"all home. next →";
      if(!state.solved[state.level]) state.solved[state.level]=true;
      for(i=0;i<F.length;i++) F[i].classList.add("win");
      if(state.level<LEVELS.length-1) advance=setTimeout(function(){ go(state.level+1); },1500);
    }else{
      scoreEl.className="score";
      for(i=0;i<F.length;i++) F[i].classList.remove("win");
      if(!rep.n&&!rep.hints.length) scoreEl.innerHTML="pond's running on defaults. type something.";
      else if(rep.hints.length&&!rep.n) scoreEl.innerHTML="that never reached the pond ↓";
      else scoreEl.innerHTML="<b>"+res.home+"</b> / "+res.total+" home";
    }
    save();
  }

  function fit(ta){ ta.style.height="auto"; ta.style.height=Math.max(ta.scrollHeight,24)+"px"; }

  // the props a level actually needs, read off its own answer so the two
  // can never drift apart
  function propsOf(sol){
    var out=[], m, re=/([a-z-]+)\s*:/g;
    while((m=re.exec(sol))) if(out.indexOf(m[1])<0) out.push(m[1]);
    return out;
  }

  // which rule the chips write into, and the label that says so
  function setActive(i){
    var blocks=rulesEl.querySelectorAll(".rule");
    activeIdx=Math.min(Math.max(i,0),blocks.length-1);
    for(var j=0;j<blocks.length;j++) blocks[j].classList.toggle("active",j===activeIdx);
    var tag=kitEl.querySelector(".target");
    if(tag) tag.textContent=LEVELS[state.level].eds[activeIdx].sel;
  }

  function write(prop,val){
    var tas=rulesEl.querySelectorAll("textarea"), ta=tas[activeIdx];
    if(!ta) return;
    var cur=ta.value.trim();
    ta.value=(cur?cur.replace(/;?$/,";")+"\n":"")+prop+": "+val+";";
    state.text[state.level+":"+activeIdx]=ta.value;
    fit(ta); ta.focus(); check(true);
  }

  function buildKit(lvl){
    kitEl.textContent="";
    var props=propsOf(lvl.sol), open=null;

    var top=document.createElement("div"); top.className="kit-row";
    var label=document.createElement("span"); label.className="kit-label";
    label.textContent=props.length>1?"in play":"in play";
    top.appendChild(label);

    var vals=document.createElement("div"); vals.className="kit-row"; vals.hidden=true;

    props.forEach(function(p){
      var chip=document.createElement("button");
      chip.type="button"; chip.className="chip"; chip.textContent=p;
      chip.addEventListener("click",function(){
        if(open===p){ open=null; vals.hidden=true; }
        else{ open=p; showVals(p); }
        [].forEach.call(top.querySelectorAll(".chip"),function(c){
          c.classList.toggle("on",c.textContent===open);
        });
      });
      top.appendChild(chip);
    });

    function showVals(p){
      vals.textContent="";
      var lab=document.createElement("span"); lab.className="kit-label";
      if(lvl.eds.length>1){
        lab.innerHTML='tap to insert into <b class="target"></b>';
        vals.appendChild(lab);
        lab.querySelector(".target").textContent=lvl.eds[activeIdx].sel;
      }else{
        lab.textContent="tap to insert";
        vals.appendChild(lab);
      }
      (VALS[p]||[]).forEach(function(v){
        var b=document.createElement("button");
        b.type="button"; b.className="chip val"; b.textContent=v;
        b.title=p+": "+v+";";
        b.addEventListener("click",function(){ write(p,v); });
        vals.appendChild(b);
      });
      vals.hidden=false;
    }

    kitEl.appendChild(top); kitEl.appendChild(vals);
    if(props.length===1) { top.querySelector(".chip").click(); }
  }

  function buildEditors(lvl){
    rulesEl.textContent="";
    activeIdx=0;
    rulesEl.classList.toggle("multi",lvl.eds.length>1);
    lvl.eds.forEach(function(ed,i){
      var box=document.createElement("div"); box.className="rule";
      var open=document.createElement("div"); open.className="sel";
      open.innerHTML="<b>"+ed.sel+"</b> {";
      var ta=document.createElement("textarea");
      ta.rows=1; ta.spellcheck=false;
      ta.setAttribute("aria-label","css for "+ed.sel);
      if(i===0) ta.placeholder="property: value;";
      ta.value=state.text[state.level+":"+i]||"";
      ta.addEventListener("focus",function(){ setActive(i); });
      box.addEventListener("mousedown",function(){ setActive(i); });
      box.addEventListener("click",function(){ ta.focus(); });
      ta.addEventListener("input",function(){
        state.text[state.level+":"+i]=ta.value;
        fit(ta); check(true);
      });
      var close=document.createElement("div"); close.className="sel"; close.textContent="}";
      box.appendChild(open); box.appendChild(ta); box.appendChild(close);
      rulesEl.appendChild(box);
      fit(ta);
    });
  }

  function go(i){
    clearTimeout(advance);
    state.level=Math.min(Math.max(i,0),LEVELS.length-1);
    var lvl=LEVELS[state.level];

    lvlEl.textContent=pad2(state.level+1);
    goalEl.innerHTML=lvl.goal;

    pond.textContent=""; pads.textContent="";
    lvl.frogs.forEach(function(c){
      var f=document.createElement("div");
      f.className="frog "+c; f.setAttribute("data-c",c);
      f.setAttribute("role","img"); f.setAttribute("aria-label",c+" frog");
      f.innerHTML=frogSvg(c); pond.appendChild(f);

      var p=document.createElement("div");
      p.className="pad p-"+c; p.setAttribute("data-c",c);
      p.innerHTML=padSvg(c); pads.appendChild(p);
    });

    solStyle.textContent=lvl.sol.replace(/#pads/g,"#stage #pads");
    buildEditors(lvl);
    buildKit(lvl);
    setActive(0);
    prevBtn.disabled=state.level===0;
    nextBtn.disabled=state.level===LEVELS.length-1;
    check(false);
  }

  document.getElementById("clear").addEventListener("click",function(){
    var areas=rulesEl.querySelectorAll("textarea");
    for(var i=0;i<areas.length;i++){
      areas[i].value=""; state.text[state.level+":"+i]=""; fit(areas[i]);
    }
    check(false);
    if(areas[0]) areas[0].focus();
  });
  nextBtn.addEventListener("click",function(){ go(state.level+1); });
  prevBtn.addEventListener("click",function(){ go(state.level-1); });

  load();
  go(state.level);
})();
</script>
